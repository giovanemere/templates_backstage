apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: oci-vcn-networking
  title: OCI Virtual Cloud Network
  description: Template para desplegar VCN y Subnets en Oracle Cloud Infrastructure
  tags:
    - oci
    - terraform
    - vcn
    - networking
    - subnet
spec:
  owner: platform-team
  type: infrastructure
  
  parameters:
    - title: Información del Proyecto
      required:
        - name
        - description
        - oci_tenancy_ocid
        - oci_compartment_ocid
        - oci_region
      properties:
        name:
          title: Nombre del Proyecto
          type: string
          description: Nombre del proyecto (será usado como prefijo para recursos)
          pattern: '^[a-zA-Z0-9-]+$'
          ui:autofocus: true
          ui:help: 'Letras, números y guiones'
        description:
          title: Descripción
          type: string
          description: Descripción del proyecto
        owner:
          title: Propietario
          type: string
          description: Equipo o persona responsable del proyecto
          default: platform-team
        oci_tenancy_ocid:
          title: OCI Tenancy OCID
          type: string
          description: OCID del tenancy de Oracle Cloud
          ui:help: 'Formato: ocid1.tenancy.oc1...'
        oci_compartment_ocid:
          title: OCI Compartment OCID
          type: string
          description: OCID del compartment donde crear recursos
          ui:help: 'Formato: ocid1.compartment.oc1...'
        oci_region:
          title: Región de OCI
          type: string
          description: Región donde desplegar los recursos
          default: us-ashburn-1
          enum:
            - us-ashburn-1
            - us-phoenix-1
            - eu-frankfurt-1
            - eu-zurich-1
            - uk-london-1
            - ap-tokyo-1
            - ap-seoul-1
            - ap-mumbai-1

    - title: Configuración de VCN
      properties:
        vcn_cidr_block:
          title: CIDR Block de VCN
          type: string
          description: Bloque CIDR para la VCN
          default: "10.0.0.0/16"
          pattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
        enable_dns_hostnames:
          title: Habilitar DNS Hostnames
          type: boolean
          description: Habilitar resolución DNS para hostnames
          default: true
        enable_dns_resolution:
          title: Habilitar DNS Resolution
          type: boolean
          description: Habilitar resolución DNS
          default: true

    - title: Configuración de Subnets
      properties:
        create_public_subnet:
          title: Crear Subnet Pública
          type: boolean
          description: Crear una subnet pública
          default: true
        public_subnet_cidr:
          title: CIDR Subnet Pública
          type: string
          description: Bloque CIDR para la subnet pública
          default: "10.0.1.0/24"
          pattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'
        create_private_subnet:
          title: Crear Subnet Privada
          type: boolean
          description: Crear una subnet privada
          default: true
        private_subnet_cidr:
          title: CIDR Subnet Privada
          type: string
          description: Bloque CIDR para la subnet privada
          default: "10.0.2.0/24"
          pattern: '^(\d{1,3}\.){3}\d{1,3}/\d{1,2}$'

    - title: Configuración del Repositorio
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
              - gitlab.com

  steps:
    - id: fetch
      name: Fetch Base
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          oci_tenancy_ocid: ${{ parameters.oci_tenancy_ocid }}
          oci_compartment_ocid: ${{ parameters.oci_compartment_ocid }}
          oci_region: ${{ parameters.oci_region }}
          vcn_cidr_block: ${{ parameters.vcn_cidr_block }}
          enable_dns_hostnames: ${{ parameters.enable_dns_hostnames }}
          enable_dns_resolution: ${{ parameters.enable_dns_resolution }}
          create_public_subnet: ${{ parameters.create_public_subnet }}
          public_subnet_cidr: ${{ parameters.public_subnet_cidr }}
          create_private_subnet: ${{ parameters.create_private_subnet }}
          private_subnet_cidr: ${{ parameters.private_subnet_cidr }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: This is ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}

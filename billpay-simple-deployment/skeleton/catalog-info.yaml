apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: BillPay Simple Deployment - ${{ values.name }}
  annotations:
    github.com/project-slug: giovanemere/${{ values.name }}
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/giovanemere/${{ values.name }}/actions
      title: GitHub Actions
      icon: github
    - url: https://github.com/giovanemere/ia-ops-iac/actions
      title: AWS Deployment
      icon: cloud
spec:
  type: service
  lifecycle: production
  owner: platform-team
  system: billpay-platform

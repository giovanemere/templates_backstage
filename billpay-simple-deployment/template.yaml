apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: billpay-simple-deployment
  title: BillPay Simple Deployment
  description: Simple BillPay deployment without EKS (S3, Lambda, CloudFront) - No repository creation
  tags:
    - billpay
    - simple
    - aws
    - s3
    - deployment-only
spec:
  owner: platform-team
  type: service
  parameters:
    - title: Deployment Configuration
      required:
        - project_name
        - environment
      properties:
        project_name:
          title: Project Name
          type: string
          pattern: '^[a-zA-Z0-9-_]+$'
          description: Name for the deployment
        environment:
          title: Environment
          type: string
          default: demo
          enum:
            - demo
            - dev
            - staging
          enumNames:
            - 'Demo Environment'
            - 'Development'
            - 'Staging'
  steps:
    - id: trigger-simple-deploy
      name: 🚀 Trigger Simple AWS Deploy
      action: github:actions:dispatch
      input:
        repoUrl: github.com?owner=giovanemere&repo=ia-ops-iac
        branchOrTagName: trunk
        workflowId: deploy-simple.yml
        workflowInputs:
          project_name: ${{ parameters.project_name }}
          environment: ${{ parameters.environment }}
  output:
    links:
      - title: 🚀 Deployment Status
        url: https://github.com/giovanemere/ia-ops-iac/actions
        icon: cloud
      - title: 📊 AWS Console
        url: https://console.aws.amazon.com/
        icon: dashboard

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ${{ values.name }}-ns

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

commonLabels:
  app: ${{ values.name }}
  version: v1.0.0
  managed-by: backstage

images:
  - name: ${{ values.image }}
    newTag: latest

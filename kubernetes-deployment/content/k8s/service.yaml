apiVersion: v1
kind: Service
metadata:
  name: ${{ values.name }}-service
  labels:
    app: ${{ values.name }}
    backstage.io/kubernetes-id: ${{ values.name }}
spec:
  type: NodePort
  ports:
  - port: ${{ values.port }}
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: ${{ values.name }}

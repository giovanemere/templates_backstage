apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: kubernetes-deployment-minikube
  title: Kubernetes Deployment para Minikube
  description: Template para crear un deployment de Kubernetes optimizado para Minikube
  tags:
    - kubernetes
    - minikube
    - deployment
    - containerization
spec:
  owner: platform-team
  type: service
  
  parameters:
    - title: Información del Proyecto
      required:
        - name
        - description
      properties:
        name:
          title: Nombre del Proyecto
          type: string
          description: Nombre del proyecto (será usado para el deployment y service)
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true
          ui:help: 'Solo letras minúsculas, números y guiones'
        description:
          title: Descripción
          type: string
          description: Descripción del proyecto
        owner:
          title: Propietario
          type: string
          description: Equipo o persona responsable del proyecto
          default: platform-team

    - title: Configuración de la Aplicación
      required:
        - image
        - port
      properties:
        image:
          title: Imagen Docker
          type: string
          description: Imagen Docker a desplegar
          default: nginx:latest
          ui:help: 'Ejemplo: nginx:latest, node:16-alpine, etc.'
        port:
          title: Puerto de la Aplicación
          type: number
          description: Puerto en el que la aplicación escucha
          default: 80
        replicas:
          title: Número de Réplicas
          type: number
          description: Número de réplicas del deployment
          default: 2
          minimum: 1
          maximum: 5

    - title: Configuración de Recursos
      properties:
        resources_requests_cpu:
          title: CPU Request
          type: string
          description: Cantidad mínima de CPU requerida
          default: "100m"
        resources_requests_memory:
          title: Memory Request
          type: string
          description: Cantidad mínima de memoria requerida
          default: "128Mi"
        resources_limits_cpu:
          title: CPU Limit
          type: string
          description: Límite máximo de CPU
          default: "500m"
        resources_limits_memory:
          title: Memory Limit
          type: string
          description: Límite máximo de memoria
          default: "512Mi"

    - title: Configuración del Repositorio
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
              - gitlab.com

  steps:
    - id: fetch
      name: Fetch Base
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          image: ${{ parameters.image }}
          port: ${{ parameters.port }}
          replicas: ${{ parameters.replicas }}
          resources_requests_cpu: ${{ parameters.resources_requests_cpu }}
          resources_requests_memory: ${{ parameters.resources_requests_memory }}
          resources_limits_cpu: ${{ parameters.resources_limits_cpu }}
          resources_limits_memory: ${{ parameters.resources_limits_memory }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: This is ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}

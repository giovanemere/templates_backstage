apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: azure-messaging-infrastructure
  title: Azure Messaging Infrastructure
  description: Template para desplegar Service Bus, Cola y Blob Storage en Azure
  tags:
    - azure
    - terraform
    - service-bus
    - queue
    - blob-storage
    - messaging
spec:
  owner: platform-team
  type: infrastructure
  
  parameters:
    - title: Información del Proyecto
      required:
        - name
        - description
        - azure_location
      properties:
        name:
          title: Nombre del Proyecto
          type: string
          description: Nombre del proyecto (será usado como prefijo para todos los recursos)
          pattern: '^[a-z0-9-]+$'
          ui:autofocus: true
          ui:help: 'Solo letras minúsculas, números y guiones'
        description:
          title: Descripción
          type: string
          description: Descripción del proyecto
        owner:
          title: Propietario
          type: string
          description: Equipo o persona responsable del proyecto
          default: platform-team
        azure_location:
          title: Región de Azure
          type: string
          description: Región donde desplegar los recursos
          default: East US
          enum:
            - East US
            - West US 2
            - Central US
            - West Europe
            - North Europe
            - Southeast Asia
            - East Asia
            - UK South
            - Australia East

    - title: Configuración de Service Bus
      properties:
        service_bus_sku:
          title: SKU de Service Bus
          type: string
          description: Nivel de servicio para Service Bus
          default: Standard
          enum:
            - Basic
            - Standard
            - Premium
        service_bus_capacity:
          title: Capacidad de Service Bus
          type: number
          description: Unidades de capacidad (solo para Premium)
          default: 1
          minimum: 1
          maximum: 16
        enable_partitioning:
          title: Habilitar Particionado
          type: boolean
          description: Habilitar particionado para la cola
          default: false
        max_delivery_count:
          title: Máximo Número de Entregas
          type: number
          description: Número máximo de intentos de entrega
          default: 10
          minimum: 1
          maximum: 2000

    - title: Configuración de Cola
      properties:
        queue_max_size:
          title: Tamaño Máximo de Cola (MB)
          type: number
          description: Tamaño máximo de la cola en MB
          default: 1024
          enum:
            - 1024
            - 2048
            - 3072
            - 4096
            - 5120
        queue_ttl:
          title: TTL de Mensajes (minutos)
          type: number
          description: Tiempo de vida de los mensajes en minutos
          default: 14400
          minimum: 1
          maximum: 525600
        enable_dead_lettering:
          title: Habilitar Dead Letter Queue
          type: boolean
          description: Habilitar cola de mensajes muertos
          default: true
        duplicate_detection:
          title: Detección de Duplicados
          type: boolean
          description: Habilitar detección de mensajes duplicados
          default: false

    - title: Configuración de Blob Storage
      properties:
        storage_account_tier:
          title: Tier de Storage Account
          type: string
          description: Nivel de rendimiento del storage account
          default: Standard
          enum:
            - Standard
            - Premium
        storage_replication:
          title: Tipo de Replicación
          type: string
          description: Tipo de replicación para el storage
          default: LRS
          enum:
            - LRS
            - GRS
            - RAGRS
            - ZRS
            - GZRS
            - RAGZRS
        blob_access_tier:
          title: Tier de Acceso por Defecto
          type: string
          description: Tier de acceso por defecto para blobs
          default: Hot
          enum:
            - Hot
            - Cool
        enable_versioning:
          title: Habilitar Versionado
          type: boolean
          description: Habilitar versionado de blobs
          default: true
        enable_soft_delete:
          title: Habilitar Soft Delete
          type: boolean
          description: Habilitar eliminación suave
          default: true
        soft_delete_retention:
          title: Retención Soft Delete (días)
          type: number
          description: Días de retención para soft delete
          default: 7
          minimum: 1
          maximum: 365

    - title: Configuración del Repositorio
      required:
        - repoUrl
      properties:
        repoUrl:
          title: Repository Location
          type: string
          ui:field: RepoUrlPicker
          ui:options:
            allowedHosts:
              - github.com
              - gitlab.com

  steps:
    - id: fetch
      name: Fetch Base
      action: fetch:template
      input:
        url: ./content
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          azure_location: ${{ parameters.azure_location }}
          service_bus_sku: ${{ parameters.service_bus_sku }}
          service_bus_capacity: ${{ parameters.service_bus_capacity }}
          enable_partitioning: ${{ parameters.enable_partitioning }}
          max_delivery_count: ${{ parameters.max_delivery_count }}
          queue_max_size: ${{ parameters.queue_max_size }}
          queue_ttl: ${{ parameters.queue_ttl }}
          enable_dead_lettering: ${{ parameters.enable_dead_lettering }}
          duplicate_detection: ${{ parameters.duplicate_detection }}
          storage_account_tier: ${{ parameters.storage_account_tier }}
          storage_replication: ${{ parameters.storage_replication }}
          blob_access_tier: ${{ parameters.blob_access_tier }}
          enable_versioning: ${{ parameters.enable_versioning }}
          enable_soft_delete: ${{ parameters.enable_soft_delete }}
          soft_delete_retention: ${{ parameters.soft_delete_retention }}

    - id: publish
      name: Publish
      action: publish:github
      input:
        allowedHosts: ['github.com']
        description: This is ${{ parameters.name }}
        repoUrl: ${{ parameters.repoUrl }}

    - id: register
      name: Register
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: '/catalog-info.yaml'

  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
      - title: Open in catalog
        icon: catalog
        entityRef: ${{ steps.register.output.entityRef }}

apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: billpay-infrastructure
  title: BillPay Infrastructure
  description: Template para desplegar infraestructura completa de BillPay (EKS, ECR, S3, CloudFront)
  tags:
    - billpay
    - aws
    - eks
    - ecr
    - s3
    - cloudfront
    - opentofu
    - terragrunt
spec:
  owner: platform-team
  type: infrastructure
  
  parameters:
    - title: Configuración del Proyecto
      required:
        - environment
        - aws_region
      properties:
        environment:
          title: Environment
          type: string
          description: Ambiente de despliegue
          enum:
            - dev
            - staging
            - prod
          enumNames:
            - Development
            - Staging
            - Production
        aws_region:
          title: AWS Region
          type: string
          description: Región de AWS donde desplegar
          default: us-east-1
          enum:
            - us-east-1
            - us-west-2
            - eu-west-1

  steps:
    - id: log
      name: Log Parameters
      action: debug:log
      input:
        message: 'Configurando BillPay Infrastructure para ${{ parameters.environment }} en ${{ parameters.aws_region }}'

  output:
    text:
      - title: Infraestructura BillPay Configurada
        content: |
          ## ✅ Configuración Completada
          
          **Environment:** ${{ parameters.environment }}
          **Region:** ${{ parameters.aws_region }}
          
          ### 🏗️ Recursos que se crearán:
          - **EKS Cluster** (t3.medium nodes)
          - **ECR Repositories** (4 repos)
          - **S3 Buckets + CloudFront** (3 frontends)
          - **Application Load Balancer**
          - **VPC + Networking** (10.0.0.0/16)
          
          ### 📂 Repositorio de Infraestructura:
          [ia-ops-iac](https://github.com/giovanemere/ia-ops-iac)
          
          ### 🚀 Siguiente paso:
          ```bash
          cd repositories/ia-ops-iac/environments/${{ parameters.environment }}
          terragrunt plan
          terragrunt apply
          ```
